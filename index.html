<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Riding Archive</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Pretendard', sans-serif; }
        #map { height: 100vh; width: 100%; z-index: 1; }

        .ui-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.9); padding: 20px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            max-width: 300px; backdrop-filter: blur(5px);
        }
        h2 { margin: 0 0 10px 0; font-size: 1.2rem; color: #333; }
        #status { font-size: 0.85rem; color: #666; margin-bottom: 10px; }
        .track-list {
            max-height: 240px; overflow-y: auto; font-size: 0.8rem;
            border-top: 1px solid #ddd; padding-top: 10px;
        }
        .track-item {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            color: #444;
            cursor: pointer;
        }
        .track-item:hover { color: #007bff; }
        .track-name {
            font-weight: bold;
            margin-bottom: 2px;
        }
        .track-description {
            font-size: 0.75rem;
            color: #666;
            line-height: 1.4;
        }

        .custom-tooltip {
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="ui-panel">
    <h2>🏍️ 투어 로그 아카이브</h2>
    <div id="status">경로를 불러오는 중...</div>
    <div class="track-list" id="track-list"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

<script>
    const CONFIG = {
        owner: 'jhkim0712',
        repo: 'jhkim0712.github.io',
        branch: 'main',
        manifestPath: 'tracks.json'
    };

    const map = L.map('map').setView([36.5, 127.5], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    function buildRawFileUrl(path) {
        return `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${path}`;
    }

    function getDisplayName(track) {
        return track.name || track.title || track.path.split('/').pop();
    }

    function getTooltipText(track) {
        const name = getDisplayName(track);
        return track.description ? `${name} - ${track.description}` : name;
    }

    async function fetchTrackManifest() {
        const response = await fetch(`./${CONFIG.manifestPath}?t=${Date.now()}`);

        if (!response.ok) {
            throw new Error(`tracks.json 로드 실패: ${response.status}`);
        }

        const items = await response.json();

        if (!Array.isArray(items)) {
            throw new Error('tracks.json 형식이 올바르지 않습니다.');
        }

        return items
            .filter(item => item.path && item.path.toLowerCase().endsWith('.gpx'))
            .map(item => ({
                path: item.path,
                name: item.name || '',
                title: item.title || '',
                description: item.description || '',
                url: buildRawFileUrl(item.path)
            }));
    }

    async function init() {
        const statusEl = document.getElementById('status');
        const listEl = document.getElementById('track-list');

        try {
            const tracks = await fetchTrackManifest();

            if (tracks.length === 0) {
                statusEl.innerText = 'tracks.json에 GPX 항목이 없습니다.';
                return;
            }

            tracks.sort((a, b) => b.path.localeCompare(a.path));

            tracks.forEach((track, index) => {
                const tooltipText = getTooltipText(track);
                const displayName = getDisplayName(track);

                const gpxLayer = new L.GPX(track.url, {
                    async: true,
                    marker_options: { startIconUrl: null, endIconUrl: null, shadowUrl: null },
                    polyline_options: { color: '#3388ff', weight: 4, opacity: 0.6 }
                });

                gpxLayer.on('loaded', function(e) {
                    const layer = e.target;

                    layer.on('mouseover', function() {
                        this.setStyle({ color: '#ff4400', weight: 7, opacity: 1 });
                        this.bindTooltip(tooltipText, {
                            sticky: true,
                            direction: 'top',
                            className: 'custom-tooltip'
                        }).openTooltip();
                    });

                    layer.on('mouseout', function() {
                        this.setStyle({ color: '#3388ff', weight: 4, opacity: 0.6 });
                        this.closeTooltip();
                    });

                    if (index === 0) {
                        map.fitBounds(layer.getBounds());
                    }
                });

                gpxLayer.on('error', function(err) {
                    console.error('GPX load error:', track.path, err);
                });

                gpxLayer.addTo(map);

                const item = document.createElement('div');
                item.className = 'track-item';

                const nameEl = document.createElement('div');
                nameEl.className = 'track-name';
                nameEl.innerText = displayName;

                const descEl = document.createElement('div');
                descEl.className = 'track-description';
                descEl.innerText = track.description || track.path.replace('tracks/', '');

                item.appendChild(nameEl);
                item.appendChild(descEl);

                item.onclick = () => {
                    const bounds = gpxLayer.getBounds && gpxLayer.getBounds();
                    if (bounds && bounds.isValid && bounds.isValid()) {
                        map.fitBounds(bounds);
                    }
                };

                listEl.appendChild(item);
            });

            statusEl.innerText = `총 ${tracks.length}개의 투어 로드 완료`;
        } catch (e) {
            console.error(e);
            statusEl.innerText = 'tracks.json 또는 GPX 파일을 불러오지 못했습니다.';
        }
    }

    init();
</script>
</body>
</html>
