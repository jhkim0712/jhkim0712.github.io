<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Riding Archive</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Pretendard', sans-serif; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        
        .ui-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.9); padding: 20px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            max-width: 300px; backdrop-filter: blur(5px);
        }
        h2 { margin: 0 0 10px 0; font-size: 1.2rem; color: #333; }
        #status { font-size: 0.85rem; color: #666; margin-bottom: 10px; }
        .track-list {
            max-height: 200px; overflow-y: auto; font-size: 0.8rem;
            border-top: 1px solid #ddd; padding-top: 10px;
        }
        .track-item { padding: 4px 0; border-bottom: 1px solid #eee; color: #444; cursor: pointer; }
        .track-item:hover { color: #007bff; font-weight: bold; }

        /* 툴팁 스타일 커스텀 */
        .custom-tooltip {
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="ui-panel">
    <h2>🏍️ 투어 로그 아카이브</h2>
    <div id="status">경로를 찾는 중...</div>
    <div class="track-list" id="track-list"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

<script>
    const CONFIG = {
        owner: 'jhkim0712',
        repo: 'jhkim0712.github.io',
        branch: 'main',
        basePath: 'tracks'
    };

    var map = L.map('map').setView([36.5, 127.5], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    async function fetchAllGpxFiles(path) {
        const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}?ref=${CONFIG.branch}`;

        try {
            const response = await fetch(url);

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`GitHub API error ${response.status}: ${errorText}`);
            }

            const items = await response.json();

            if (!Array.isArray(items)) {
                throw new Error(`Unexpected API response for ${path}`);
            }

            let files = [];

            for (const item of items) {
                if (item.type === 'dir') {
                    const subFiles = await fetchAllGpxFiles(item.path);
                    files = files.concat(subFiles);
                } else if (item.type === 'file' && item.name.toLowerCase().endsWith('.gpx')) {
                    files.push({
                        name: item.name,
                        path: item.path,
                        url: `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${item.path}`
                    });
                }
            }

            return files;
        } catch (e) {
            console.error('Failed to fetch GPX files:', e);
            throw e;
        }
    }

    async function init() {
        const statusEl = document.getElementById('status');
        const listEl = document.getElementById('track-list');

        try {
            const gpxFiles = await fetchAllGpxFiles(CONFIG.basePath);

            if (gpxFiles.length === 0) {
                statusEl.innerText = 'GPX 파일은 있지만 API 응답 문제일 수 있습니다. 콘솔을 확인해 주세요.';
                return;
            }

            gpxFiles.sort((a, b) => b.path.localeCompare(a.path));

            gpxFiles.forEach((file, index) => {
                const gpxLayer = new L.GPX(file.url, {
                    async: true,
                    marker_options: { startIconUrl: null, endIconUrl: null, shadowUrl: null },
                    polyline_options: { color: '#3388ff', weight: 4, opacity: 0.6 }
                });

                gpxLayer.on('loaded', function(e) {
                    const layer = e.target;
                    const fileName = file.path.split('/').pop();

                    layer.on('mouseover', function() {
                        this.setStyle({ color: '#ff4400', weight: 7, opacity: 1 });
                        this.bindTooltip(fileName, {
                            sticky: true,
                            direction: 'top',
                            className: 'custom-tooltip'
                        }).openTooltip();
                    });

                    layer.on('mouseout', function() {
                        this.setStyle({ color: '#3388ff', weight: 4, opacity: 0.6 });
                        this.closeTooltip();
                    });

                    if (index === 0) map.fitBounds(layer.getBounds());
                });

                gpxLayer.on('error', function(err) {
                    console.error('GPX load error:', file.path, err);
                });

                gpxLayer.addTo(map);

                const item = document.createElement('div');
                item.className = 'track-item';
                item.innerText = file.path.replace(CONFIG.basePath + '/', '');
                item.onclick = () => {
                    const bounds = gpxLayer.getBounds && gpxLayer.getBounds();
                    if (bounds && bounds.isValid && bounds.isValid()) {
                        map.fitBounds(bounds);
                    }
                };
                listEl.appendChild(item);
            });

            statusEl.innerText = `총 ${gpxFiles.length}개의 투어 로드 완료`;
        } catch (e) {
            console.error(e);
            statusEl.innerText = 'GPX 목록을 불러오지 못했습니다. 잠시 후 다시 시도하거나 콘솔을 확인해 주세요.';
        }
    }

    init();
</script>
</body>
</html>
