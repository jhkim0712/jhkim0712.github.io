<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>My Riding Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script>
        // 저장된 테마를 첫 페인트 전에 적용 (깜빡임 방지)
        try {
            if (localStorage.getItem('ridingArchive.theme') === 'light') {
                document.documentElement.dataset.theme = 'light';
            }
        } catch (e) {}
    </script>
</head>
<body>

<div class="ui-panel">
    <div class="panel-header">
        <div class="panel-tag">// NIGHT CITY RIDE LOG</div>
        <label class="theme-switch" title="라이트/다크 테마 전환">
            <span class="theme-switch-label" aria-hidden="true"></span>
            <input id="theme-toggle" class="theme-switch-input" type="checkbox" role="switch" aria-label="다크 테마" checked />
            <span class="theme-switch-track" aria-hidden="true"><span class="theme-switch-thumb"></span></span>
        </label>
    </div>
    <h2 class="glitch" data-text="투어 로그 아카이브">투어 로그 아카이브</h2>
    <div id="status">경로를 불러오는 중...</div>
    <div class="toolbar">
        <input id="search-input" class="search-input" type="text" placeholder="제목, 지역, 설명으로 검색" />
        <select id="basemap-select" class="basemap-select" title="배경지도 선택">
            <option value="vworld">브이월드</option>
            <option value="osm">OSM 지도</option>
            <option value="naver">네이버지도</option>
        </select>
    </div>
    <div class="view-mode-toggle" id="view-mode-toggle" role="group" aria-label="경로 표시 범위">
        <button type="button" class="view-mode-btn active" data-mode="all">전체 경로 보기</button>
        <button type="button" class="view-mode-btn" data-mode="selected">선택 경로만 보기</button>
    </div>
    <div id="basemap-hint" class="basemap-hint" hidden></div>
    <div class="track-list" id="track-list"></div>
</div>

<div id="map"></div>
<div id="map-naver" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
